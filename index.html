<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ETHEREAL GAMES HUB</title>
    <style>
        :root {
            --bg: #050505;
            --cyan: #00f3ff;
            --pink: #ff0055;
            --purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: black; color: white; height: 100dvh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            perspective: 1000px;
        }

        /* 背景流光 */
        .void-bg {
            position: absolute; width: 200%; height: 200%; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000 60%);
            animation: spin 60s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        h1 {
            font-size: 2.5rem; letter-spacing: 8px; margin-bottom: 40px;
            text-shadow: 0 0 20px var(--cyan); text-transform: uppercase; text-align: center;
        }

        .grid-menu {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px; width: 90%; max-width: 1000px;
            transform-style: preserve-3d;
        }

        .card {
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 15px;
            height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-decoration: none; color: white; position: relative; overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s; cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.3);
        }

        /* 象棋卡片特效 */
        .card.chess:hover { box-shadow: 0 0 30px var(--cyan); }
        .card.chess::before {
            content: '♔'; font-size: 8rem; opacity: 0.1; position: absolute;
            transition: 0.5s;
        }
        .card.chess:hover::before { opacity: 0.8; transform: scale(1.2); color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }

        /* 围棋卡片特效 */
        .card.go:hover { box-shadow: 0 0 30px var(--pink); }
        .card.go::before {
            content: ''; width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid white; opacity: 0.1; position: absolute;
            transition: 0.5s;
        }
        .card.go:hover::before { opacity: 0.8; background: var(--pink); border-color: var(--pink); box-shadow: 0 0 50px var(--pink); transform: scale(1.2); }

        /* 待开发卡片 */
        .card.soon { opacity: 0.5; cursor: default; border-style: dashed; }
        .card.soon:hover { transform: none; box-shadow: none; }

        h2 { z-index: 2; font-size: 1.5rem; letter-spacing: 3px; margin-top: 20px; }
        p { z-index: 2; font-size: 0.8rem; opacity: 0.6; margin-top: 5px; letter-spacing: 1px; }

    </style>
</head>
<body>
    <div class="void-bg"></div>
    
    <h1>ETHEREAL HUB</h1>

    <div class="grid-menu">
        <a href="chess.html" class="card chess">
            <h2>CHESS</h2>
            <p>TACTICAL WARFARE</p>
        </a>

        <a href="go.html" class="card go">
            <h2>GO / WEIQI</h2>
            <p>TERRITORIAL CONTROL</p>
        </a>

        <div class="card soon">
            <h2>COMING SOON</h2>
            <p>UNKNOWN SIGNAL</p>
        </div>
    </div>
</body>
</html>
