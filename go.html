<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ETHEREAL GO - PRECISION</title>
    <style>
        :root {
            --bg: #050505;
            --board-bg: rgba(255, 255, 255, 0.03);
            --line-color: rgba(255, 255, 255, 0.25);
            --p1: #00f3ff; /* Cyan */
            --p2: #ff0055; /* Pink */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'Segoe UI', sans-serif; touch-action: none; }

        body {
            margin: 0; height: 100dvh; background: #080808; color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* 背景特效 */
        .nebula {
            position: absolute; width: 100%; height: 100%; z-index: -1; pointer-events: none;
            background: 
                radial-gradient(circle at 10% 10%, rgba(0, 243, 255, 0.05), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.05), transparent 40%);
        }

        /* HUD */
        .hud {
            width: 90vw; max-width: 500px; display: flex; justify-content: space-between;
            margin-bottom: 20px; padding: 12px 20px; background: rgba(255,255,255,0.05);
            border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem; backdrop-filter: blur(10px);
        }
        .score-box { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; transition: 0.3s; }
        .active-p1 .dot { background: var(--p1); box-shadow: 0 0 8px var(--p1); }
        .active-p2 .dot { background: var(--p2); box-shadow: 0 0 8px var(--p2); }

        /* 棋盘整体容器 (木板边缘) */
        .board-container {
            width: 92vw; height: 92vw; max-width: 500px; max-height: 500px;
            background: var(--board-bg);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            position: relative;
            /* 这里的 padding 决定了边缘留白的大小 */
            padding: 20px; 
        }

        /* 内部棋盘区域 (第一条线到最后一条线的区域) */
        .board-inner {
            width: 100%; height: 100%;
            position: relative;
        }

        /* 线条层 */
        .line { position: absolute; background: var(--line-color); }
        .line.horz { height: 1px; left: 0; width: 100%; }
        .line.vert { width: 1px; top: 0; height: 100%; }

        /* 星位 */
        .star {
            position: absolute; width: 6px; height: 6px; background: white; border-radius: 50%;
            transform: translate(-50%, -50%); opacity: 0.8;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        /* 棋子容器层 */
        .stones-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* 让点击穿透到下面的交互层 */
        }

        .stone {
            position: absolute;
            width: 6.5%; height: 6.5%; /* 相对于 board-inner 的尺寸 */
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .stone.show { transform: translate(-50%, -50%) scale(1); }

        .stone.p1 { background: radial-gradient(circle at 30% 30%, #333, #000); border: 1px solid var(--p1); box-shadow: 0 0 8px var(--p1); }
        .stone.p2 { background: radial-gradient(circle at 30% 30%, #fff, #ccc); border: 1px solid var(--p2); box-shadow: 0 0 8px var(--p2); }
        
        .stone.last-move::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background: red; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 4px red;
        }

        /* 交互层 (覆盖整个容器) */
        .interaction-layer {
            position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px;
            z-index: 20; cursor: pointer;
            /* 开启点击高亮去除 */
            -webkit-tap-highlight-color: transparent;
        }

        /* 菜单 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; transition: opacity 0.4s;
        }
        .hidden { opacity: 0; pointer-events: none; }

        h1 { letter-spacing: 6px; color: var(--p1); margin-bottom: 30px; text-shadow: 0 0 20px var(--p1); }
        .btn {
            padding: 12px 40px; border: 1px solid var(--p1); color: var(--p1);
            background: transparent; margin: 10px; font-size: 1rem; cursor: pointer;
            transition: 0.2s; letter-spacing: 2px; min-width: 200px;
        }
        .btn:hover { background: var(--p1); color: black; box-shadow: 0 0 20px var(--p1); }

        .bottom-controls { margin-top: 30px; display: flex; gap: 20px; }
        .mini-btn { padding: 10px 20px; border: 1px solid #555; background: transparent; color: #888; border-radius: 20px; }

    </style>
</head>
<body>
    <div class="nebula"></div>

    <div id="start-screen" class="overlay">
        <h1>ETHEREAL GO</h1>
        <button class="btn" onclick="game.start(1)">NOVICE</button>
        <button class="btn" onclick="game.start(2)">ADEPT</button>
        <button class="btn" onclick="game.start(3)">MASTER</button>
    </div>

    <div id="end-screen" class="overlay hidden">
        <h1 id="end-msg">GAME OVER</h1>
        <div id="score-display" style="margin-bottom: 20px; color: #ccc;"></div>
        <button class="btn" onclick="game.start(game.diff)">REBOOT</button>
        <button class="btn" onclick="window.location.href='index.html'">EXIT</button>
    </div>

    <div class="hud">
        <div class="score-box active-p1" id="p1-status">
            <div class="dot"></div> YOU <span style="opacity:0.5" id="cap-p1">0</span>
        </div>
        <div class="score-box" id="p2-status">
            <span style="opacity:0.5" id="cap-p2">0</span> AI <div class="dot"></div>
        </div>
    </div>

    <div class="board-container">
        <div class="board-inner" id="board-inner">
            <div id="lines-layer"></div>
            <div id="stones-layer" class="stones-layer"></div>
            
            <div class="interaction-layer" id="interaction-layer"></div>
        </div>
    </div>

    <div class="bottom-controls">
        <button class="mini-btn" onclick="game.pass()">PASS</button>
        <button class="mini-btn" onclick="window.location.href='index.html'">EXIT</button>
    </div>

<script>
const SIZE = 13;

class GoEngine {
    constructor() {
        this.board = [];
        this.turn = 1;
        this.caps = {1:0, 2:0};
        this.ko = null;
        this.history = [];
        this.lastMove = null;
        this.diff = 1;
        this.state = 'init';
        this.passed = false;
    }

    init() {
        this.drawBoard();
        this.setupInteraction();
    }

    start(level) {
        this.diff = level;
        this.reset();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        this.state = 'play';
    }

    reset() {
        this.board = Array(SIZE).fill(0).map(() => Array(SIZE).fill(0));
        this.turn = 1;
        this.caps = {1:0, 2:0};
        this.ko = null;
        this.lastMove = null;
        this.passed = false;
        
        // Clear UI stones
        document.getElementById('stones-layer').innerHTML = '';
        this.updateUI();
    }

    drawBoard() {
        const layer = document.getElementById('lines-layer');
        layer.innerHTML = '';

        // Draw Lines using Absolute Positioning %
        for (let i = 0; i < SIZE; i++) {
            const pos = (i / (SIZE - 1)) * 100;
            
            // Horizontal Line
            const h = document.createElement('div');
            h.className = 'line horz';
            h.style.top = pos + '%';
            layer.appendChild(h);

            // Vertical Line
            const v = document.createElement('div');
            v.className = 'line vert';
            v.style.left = pos + '%';
            layer.appendChild(v);
        }

        // Draw Stars (13x13: 3,3 | 3,9 | 6,6 | 9,3 | 9,9)
        const stars = [[3,3], [3,9], [6,6], [9,3], [9,9]];
        stars.forEach(([r, c]) => {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.top = (r / (SIZE - 1)) * 100 + '%';
            s.style.left = (c / (SIZE - 1)) * 100 + '%';
            layer.appendChild(s);
        });
    }

    setupInteraction() {
        const layer = document.getElementById('interaction-layer');
        layer.addEventListener('pointerup', (e) => {
            if(this.state !== 'play' || this.turn !== 1) return;
            
            // Precision Click Calculation
            const rect = document.getElementById('board-inner').getBoundingClientRect();
            
            // Position relative to the inner board (where lines start/end)
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Step size
            const stepX = rect.width / (SIZE - 1);
            const stepY = rect.height / (SIZE - 1);
            
            // Round to nearest intersection
            const c = Math.round(x / stepX);
            const r = Math.round(y / stepY);

            // Validate bounds
            if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
                // Optional: check if click was too far from intersection (tolerance)
                // For mobile, we usually skip tolerance to be friendly
                this.play(r, c);
            }
        });
    }

    play(r, c) {
        if (this.isValidMove(r, c, 1)) {
            this.executeMove(r, c, 1);
            this.turn = 2;
            this.updateUI();
            setTimeout(() => this.aiTurn(), 400);
        } else {
            // Vibration for error?
            if(navigator.vibrate) navigator.vibrate(50);
        }
    }

    // --- CORE RULES ---
    inBounds(r, c) { return r>=0 && r<SIZE && c>=0 && c<SIZE; }

    getGroup(r, c, board=this.board) {
        const color = board[r][c];
        if(color === 0) return null;
        let stones = [], libs = new Set(), visited = new Set();
        let q = [[r,c]];
        visited.add(r+','+c);
        
        while(q.length) {
            const [cr, cc] = q.shift();
            stones.push([cr, cc]);
            [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc]) => {
                const nr=cr+dr, nc=cc+dc;
                if(this.inBounds(nr,nc)) {
                    const k = nr+','+nc;
                    if(board[nr][nc] === 0) libs.add(k);
                    else if(board[nr][nc] === color && !visited.has(k)) {
                        visited.add(k);
                        q.push([nr,nc]);
                    }
                }
            });
        }
        return { stones, libs: libs.size };
    }

    isValidMove(r, c, color, mockBoard=null) {
        const b = mockBoard || this.board;
        if (b[r][c] !== 0) return false;
        if (this.ko && this.ko[0]===r && this.ko[1]===c) return false;
        
        // Quick suicide check
        // Simulate
        let nb = b.map(row => [...row]);
        nb[r][c] = color;
        let captured = 0;
        const opp = color===1?2:1;
        
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc]) => {
            const nr=r+dr, nc=c+dc;
            if(this.inBounds(nr,nc) && nb[nr][nc]===opp) {
                const g = this.getGroup(nr, nc, nb);
                if(g.libs === 0) captured += g.stones.length;
            }
        });

        if(captured > 0) return true; // Valid capture
        const myG = this.getGroup(r, c, nb);
        if(myG.libs === 0) return false; // Suicide
        return true;
    }

    executeMove(r, c, color) {
        this.board[r][c] = color;
        let captured = [];
        const opp = color===1?2:1;
        
        // Check Captures
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc]) => {
            const nr=r+dr, nc=c+dc;
            if(this.inBounds(nr,nc) && this.board[nr][nc]===opp) {
                const g = this.getGroup(nr, nc);
                if(g.libs === 0) captured.push(...g.stones);
            }
        });

        captured.forEach(([cr, cc]) => this.board[cr][cc] = 0);
        this.caps[color] += captured.length;
        
        // Check Ko
        const myG = this.getGroup(r, c);
        if(captured.length === 1 && myG.stones.length === 1 && myG.libs === 1) {
            this.ko = captured[0];
        } else {
            this.ko = null;
        }

        this.lastMove = [r, c];
        this.passed = false;
        this.renderStone(r, c, color);
        this.removeStones(captured);
        
        if(navigator.vibrate) navigator.vibrate(captured.length > 0 ? 40 : 10);
    }

    // --- VISUALS ---
    renderStone(r, c, color) {
        const layer = document.getElementById('stones-layer');
        
        // Remove previous "last move" marker
        const prev = layer.querySelector('.last-move');
        if(prev) prev.classList.remove('last-move');

        const s = document.createElement('div');
        s.className = `stone p${color} last-move`;
        s.id = `s-${r}-${c}`;
        // Absolute positioning logic:
        s.style.top = (r / (SIZE - 1)) * 100 + '%';
        s.style.left = (c / (SIZE - 1)) * 100 + '%';
        
        layer.appendChild(s);
        requestAnimationFrame(() => s.classList.add('show'));
    }

    removeStones(list) {
        list.forEach(([r, c]) => {
            const el = document.getElementById(`s-${r}-${c}`);
            if(el) el.remove();
        });
    }

    updateUI() {
        const p1 = document.getElementById('p1-status');
        const p2 = document.getElementById('p2-status');
        document.getElementById('cap-p1').innerText = this.caps[1];
        document.getElementById('cap-p2').innerText = this.caps[2];
        
        if(this.turn===1) { p1.classList.add('active-p1'); p2.classList.remove('active-p2'); }
        else { p1.classList.remove('active-p1'); p2.classList.add('active-p2'); }
    }

    // --- AI ---
    aiTurn() {
        if(this.state !== 'play') return;
        
        const moves = [];
        for(let r=0; r<SIZE; r++) for(let c=0; c<SIZE; c++) {
            if(this.isValidMove(r, c, 2)) moves.push([r,c]);
        }

        if(moves.length === 0) { this.pass(); return; }

        // Random Factor based on difficulty
        // Novice: Pure Random
        if(this.diff === 1 && Math.random() < 0.3) {
            const m = moves[Math.floor(Math.random()*moves.length)];
            this.executeMove(m[0], m[1], 2);
            this.endTurn();
            return;
        }

        // Greedy Eval
        let best = null; 
        let maxScore = -9999;
        
        // Shuffle
        moves.sort(() => Math.random() - 0.5);
        
        for(let [r, c] of moves) {
            let score = 0;
            
            // Simulate
            let nb = this.board.map(row => [...row]);
            nb[r][c] = 2;
            
            // 1. Capture Bonus
            let caps = 0;
            let atari = 0;
            [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr,dc]) => {
                const nr=r+dr, nc=c+dc;
                if(this.inBounds(nr,nc) && nb[nr][nc]===1) {
                    const g = this.getGroup(nr, nc, nb);
                    if(g.libs === 0) caps += g.stones.length;
                    else if(g.libs === 1) atari += 1;
                }
            });
            score += caps * 100;
            score += atari * 20;

            // 2. Self Safety
            const selfG = this.getGroup(r, c, nb);
            if(selfG.libs === 1) score -= 50; // Bad shape
            if(selfG.libs > 2) score += 5;

            // 3. Position (Distance to center/edge)
            const edgeDist = Math.min(r, c, SIZE-1-r, SIZE-1-c);
            if(edgeDist === 0) score -= 10; // 1st line is bad
            if(edgeDist === 2) score += 5; // 3rd line is good territory
            
            if(score > maxScore) { maxScore = score; best = [r, c]; }
        }

        if(best) {
            this.executeMove(best[0], best[1], 2);
            this.endTurn();
        } else {
            this.pass();
        }
    }

    endTurn() {
        this.turn = 1;
        this.updateUI();
    }

    pass() {
        if(this.passed) {
            this.endGame();
            return;
        }
        this.passed = true;
        this.turn = this.turn===1?2:1;
        this.updateUI();
        if(this.turn===2) setTimeout(() => this.aiTurn(), 500);
    }

    endGame() {
        this.state = 'end';
        const b = this.caps[1];
        const w = this.caps[2] + 6.5;
        // Note: This is a simplified score display. Real Go scoring is complex.
        // Here we just show captures + komi for the "arcade" feel.
        document.getElementById('end-msg').innerText = b > w ? "VICTORY" : "DEFEAT";
        document.getElementById('end-msg').style.color = b > w ? "var(--p1)" : "var(--p2)";
        document.getElementById('score-display').innerText = `Caps: Black ${b} - White ${w}`;
        document.getElementById('end-screen').classList.remove('hidden');
    }
}

const game = new GoEngine();
game.init();
</script>
</body>
</html>
